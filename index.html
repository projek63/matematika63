<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perkalian & Pembagian Dasar</title>
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxXi7waJB2ZMeheiXaEj6uyDhRo9So1Ne_03ylJyBKR7Ac2Culg4V--1s-_u7GjPQ7mmw/exec">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #334155;
      background: linear-gradient(135deg, #FEF08A 0%, #BAE6FD 45%, #A7F3D0 100%);
    }
    .box { text-align: center; padding: 24px; }
    .spin {
      width: 40px; height: 40px; margin: 0 auto 14px;
      border: 4px solid #cbd5e1; border-top-color: #059669;
      border-radius: 50%; animation: s 0.8s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #0369a1; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>Memuat Perkalian &amp; Pembagian Dasar...</p>
    <p style="font-size:13px">Jika tidak berpindah otomatis,
      <a href="https://script.google.com/macros/s/AKfycbxXi7waJB2ZMeheiXaEj6uyDhRo9So1Ne_03ylJyBKR7Ac2Culg4V--1s-_u7GjPQ7mmw/exec">klik di sini</a>.
    </p>
  </div>
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbxXi7waJB2ZMeheiXaEj6uyDhRo9So1Ne_03ylJyBKR7Ac2Culg4V--1s-_u7GjPQ7mmw/exec");
  </script>
</body>
</html>
